[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Классический минимум ruff: ошибки стиля (E4/E7/E9) и Pyflakes (F).
# Сознательно не включаем более широкие наборы (BLE/DTZ/RUF/…), чтобы линтер
# ловил реальные проблемы, а не тонул в легаси-замечаниях эксперимента.
select = ["E4", "E7", "E9", "F"]
