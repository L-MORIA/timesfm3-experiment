name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Тестам нужны только numpy/pandas/matplotlib/requests:
      # torch и timesfm в timesfm_kronos_compare импортируются лениво
      # внутри load_*(), поэтому тяжёлые зависимости не требуются.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas matplotlib requests

      - name: Run tests
        run: python -m pytest -q
